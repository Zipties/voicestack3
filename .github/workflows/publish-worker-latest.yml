name: Publish Worker Latest

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate diarization contracts
        run: |
          python -m pip install numpy pandas
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=worker python -m unittest discover -s worker/tests -p test_diarization.py -v
      - name: Build and publish default CUDA worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Containerfile
          push: true
          platforms: linux/amd64
          build-args: |
            PLATFORM=cuda
          # Nemotron and other default models are public. Do not pass the exposed
          # legacy HF token; gated pyannote fallback caches remain optional.
          tags: |
            ghcr.io/zipties/voicestack3-worker:latest
            ghcr.io/zipties/voicestack3-worker:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Zipties/voicestack3
            org.opencontainers.image.revision=${{ github.sha }}
